<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finder — Instant launcher for Windows</title>
<meta name="description" content="Finder is a keyboard launcher for Windows. Ctrl+Space, type, launch. Apps, files, folders, calculator — no mouse.">
<style>
/* — Finder's exact design tokens (tauri-ui/styles.css) — */
:root{
  --font-mac:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  --accent-blue:#007aff;
  --accent-blue-rgb:0,122,255;
  --radius-window:16px;
  --radius-item:8px;
  --radius-badge:5px;
  --bg-window:rgba(28,28,30,0.82);
  --bg-preview:rgba(22,23,26,0.77);
  --bg-card:rgba(255,255,255,0.08);
  --bg-hover:rgba(255,255,255,0.08);
  --bg-selected:rgba(0,122,255,0.3);
  --border-window:rgba(255,255,255,0.14);
  --border-subtle:rgba(255,255,255,0.08);
  --glass-border:rgba(0,0,0,0.37);
  --text-primary:#ffffff;
  --text-secondary:rgba(235,235,245,0.65);
  --text-tertiary:rgba(235,235,245,0.4);
  --path-on-selected:rgba(255,255,255,0.55);
  --shadow-mac:0 0 0 1px var(--glass-border),0 2px 8px rgba(0,0,0,0.22),0 0 22px rgba(0,0,0,0.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-mac);
  color:var(--text-primary);
  background:#0a0a0c;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
/* desktop-wallpaper feel behind the window */
.desk{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(900px 500px at 78% 82%, rgba(88,86,214,0.16), transparent 60%),
    radial-gradient(700px 420px at 12% 18%, rgba(0,122,255,0.10), transparent 60%),
    linear-gradient(160deg,#0d0d10 0%,#0a0a0c 55%,#101014 100%);
}
.desk::after{
  content:"";position:absolute;inset:0;
  backdrop-filter:blur(0px);
}
.stage{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  padding:48px 20px 28px;
}
/* — the Finder window, same to same — */
.launcher{
  width:760px;max-width:calc(100vw - 32px);
  background:var(--bg-window);
  border:1px solid var(--border-window);
  border-radius:var(--radius-window);
  box-shadow:var(--shadow-mac), 0 30px 80px rgba(0,0,0,0.5);
  backdrop-filter:blur(24px) saturate(1.6);
  overflow:hidden;
}
.search-header{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--border-subtle);
}
.search-header svg{flex:none;opacity:0.55}
#q{
  flex:1;background:transparent;border:0;outline:0;
  color:var(--text-primary);
  font-family:var(--font-mac);font-size:15px;
}
#q::placeholder{color:var(--text-tertiary)}
.gear{opacity:0.55;display:flex}
.body{display:flex;min-height:380px}
.results{
  flex:1.25;min-width:0;
  padding:8px;
  overflow-y:auto;max-height:420px;
  border-right:1px solid var(--border-subtle);
}
.results::-webkit-scrollbar{width:5px}
.results::-webkit-scrollbar-thumb{background:var(--bg-hover);border-radius:10px}
.group-label{
  font-family:var(--font-mono);
  font-size:10px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-tertiary);
  padding:6px 8px 4px;
}
.row{
  display:flex;align-items:center;gap:12px;
  padding:8px 10px;
  border-radius:var(--radius-item);
  cursor:default;
}
.row:hover{background:var(--bg-hover)}
.row.sel{background:var(--bg-selected);box-shadow:inset 0 0 0 1px rgba(0,122,255,0.55)}
.chip{
  width:30px;height:30px;flex:none;
  display:grid;place-items:center;
  border-radius:7px;
  font-size:13px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,0.16),rgba(255,255,255,0.05));
  border:1px solid var(--border-subtle);
}
.row .txt{min-width:0;flex:1}
.row .name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .path{
  font-family:var(--font-mono);font-size:10.5px;
  color:var(--text-tertiary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row.sel .path{color:var(--path-on-selected)}
.badge{
  flex:none;
  font-size:11px;color:var(--text-secondary);
  background:var(--bg-card);
  border-radius:var(--radius-badge);
  padding:2px 8px;
}
.row.sel .badge{background:rgba(255,255,255,0.16);color:#fff}
/* preview pane */
.preview{
  width:300px;flex:none;
  background:var(--bg-preview);
  display:flex;flex-direction:column;align-items:center;
  padding:26px 18px 12px;
  text-align:center;
}
.p-icon{
  width:88px;height:88px;
  display:grid;place-items:center;
  border-radius:14px;
  font-size:34px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,0.14),rgba(255,255,255,0.05));
  border:1px solid var(--border-subtle);
}
.p-name{margin-top:14px;font-size:14px;font-weight:600}
.p-kind{margin-top:2px;font-size:12px;color:var(--text-secondary)}
.p-sec{
  width:100%;margin-top:16px;padding-top:12px;
  border-top:1px solid var(--border-subtle);
  display:flex;flex-direction:column;gap:2px;text-align:left;
}
.p-where-l{font-size:11px;color:var(--text-tertiary);padding:0 8px}
.p-where{
  font-family:var(--font-mono);font-size:10.5px;
  color:var(--text-secondary);
  padding:2px 8px 6px;
  word-break:break-all;
}
.p-act{
  font-size:13px;color:var(--text-primary);
  padding:9px 8px;border-radius:var(--radius-item);
}
.p-act:hover{background:var(--bg-hover)}
/* calculator row (matches app math hero) */
.calc{
  margin:8px;
  background:var(--bg-card);
  border:1px solid var(--border-subtle);
  border-radius:12px;
  padding:14px 18px;
  display:none;
}
.calc.on{display:block}
.calc .e{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)}
.calc .a{font-size:30px;font-weight:700;letter-spacing:-0.02em;margin-top:4px}
/* below-window: download, styled like the app */
.below{
  margin-top:26px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  text-align:center;
}
.hint{
  font-size:12.5px;color:var(--text-secondary);
  display:flex;align-items:center;gap:7px;
}
.kbd{
  font-family:var(--font-mono);font-size:11px;
  border:1px solid var(--border-window);border-bottom-width:2px;
  border-radius:5px;padding:2px 7px;
  background:rgba(255,255,255,0.06);
}
.ctas{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  height:38px;padding:0 18px;
  border-radius:var(--radius-item);
  font-family:var(--font-mac);font-size:13px;font-weight:600;
  text-decoration:none;cursor:pointer;
}
.btn-primary{background:var(--accent-blue);color:#fff;border:1px solid transparent}
.btn-primary:hover{background:#2b8dff}
.btn-ghost{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-window)}
.btn-ghost:hover{background:rgba(255,255,255,0.12)}
.fine{
  font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary);
}
.fine a{color:var(--text-secondary);text-decoration:none}
@media(max-width:820px){
  .preview{display:none}
  .launcher{width:100%}
}
</style>
</head>
<body>
<div class="desk"></div>

<div class="stage">
  <div class="launcher">
    <div class="search-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search apps, files, folders..." autocomplete="off" spellcheck="false">
      <span class="gear">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </span>
    </div>

    <div class="calc" id="calc"><div class="e" id="ce"></div><div class="a" id="ca"></div></div>

    <div class="body">
      <div class="results" id="list"></div>
      <div class="preview">
        <div class="p-icon" id="pi">A</div>
        <div class="p-name" id="pt">Access</div>
        <div class="p-kind" id="pk">Application</div>
        <div class="p-sec">
          <div class="p-where-l">Where</div>
          <div class="p-where" id="pw">aumid:Microsoft.Office.MSACCESS.EXE.15</div>
          <div class="p-act">Run as administrator</div>
          <div class="p-act">Open file location</div>
        </div>
      </div>
    </div>
  </div>

  <div class="below">
    <div class="hint">
      <span class="kbd">Ctrl</span><span class="kbd">Space</span> to summon — this is the real UI, try typing
    </div>
    <div class="ctas">
      <a class="btn btn-primary" href="https://github.com/anshdadhich/finder-releases/releases/latest/download/Finder_0.2.3_x64-setup.exe">Download Finder — free</a>
      <a class="btn btn-ghost" href="https://github.com/anshdadhich/finder-releases/releases/latest/download/Finder_0.2.3_x64-portable.zip">Portable ZIP</a>
    </div>
    <div class="fine">v0.2.3 • Windows 10/11 x64 • signed installer • auto-updates • <a href="https://github.com/anshdadhich/finder-releases/releases">all releases</a></div>
  </div>
</div>

<script>
const apps=[
  {n:"Access",p:"aumid:Microsoft.Office.MSACCESS.EXE.15",k:"Application",t:"app",i:"A"},
  {n:"Administrative Tools",p:"Administrative Tools.lnk",k:"Application",t:"app",i:"⚙"},
  {n:"Antigravity",p:"Antigravity",k:"Application",t:"app",i:"A"},
  {n:"Antigravity IDE",p:"Antigravity IDE",k:"Application",t:"app",i:"A"},
  {n:"Calculator",p:"Calculator",k:"Application",t:"app",i:"▦"},
  {n:"Calendar",p:"Calendar",k:"Application",t:"app",i:"◫"},
  {n:"Camera",p:"Camera",k:"Application",t:"app",i:"◎"},
  {n:"Chrome",p:"chrome.exe",k:"Application",t:"app",i:"○"},
  {n:"Code",p:"Code.exe",k:"Application",t:"app",i:"⌖"},
  {n:"Control Panel",p:"Control Panel",k:"Application",t:"app",i:"🎛"},
  {n:"Downloads",p:"C:\\Users\\you\\Downloads",k:"Folder",t:"dir",i:"▸"},
  {n:"Documents",p:"C:\\Users\\you\\Documents",k:"Folder",t:"dir",i:"▸"},
  {n:"whatsapp.py",p:"C:\\Projects\\whatsapp.py",k:"File",t:"file",i:"≡"},
  {n:"whats-new.md",p:"C:\\Docs\\whats-new.md",k:"File",t:"file",i:"≡"},
];
const q=document.getElementById('q'), list=document.getElementById('list');
const pi=document.getElementById('pi'), pt=document.getElementById('pt'), pk=document.getElementById('pk'), pw=document.getElementById('pw');
const calc=document.getElementById('calc'), ce=document.getElementById('ce'), ca=document.getElementById('ca');
let sel=0;
function calcTry(s){
  if(!s || !/^[\d\s\.\+\-\*\/\%\(\)\^,]+$/.test(s)) return null;
  try{const v=Function('"use strict";return ('+s.replace(/\^/g,'**')+')')(); if(typeof v==='number'&&isFinite(v)) return String(v)}catch{}
  return null;
}
function render(){
  const v=q.value.trim(), ql=v.toLowerCase();
  const cv=calcTry(v);
  if(cv!==null){ calc.classList.add('on'); ce.textContent=v+' ='; ca.textContent=Number(cv).toLocaleString(); } else calc.classList.remove('on');
  let items=apps.filter(a=> !ql || a.n.toLowerCase().includes(ql) || a.p.toLowerCase().includes(ql));
  if(!ql) items=apps.slice(0,9);
  list.innerHTML='';
  if(!items.length){ list.innerHTML='<div style="padding:24px;text-align:center;color:rgba(235,235,245,0.4);font-size:13px">No results</div>'; return; }
  const g=document.createElement('div'); g.className='group-label'; g.textContent= v ? 'Results' : 'Applications'; list.appendChild(g);
  items.forEach((it,i)=>{
    const r=document.createElement('div'); r.className='row'+(i===sel?' sel':'');
    r.innerHTML=`<div class="chip">${it.i}</div><div class="txt"><div class="name">${it.n}</div><div class="path">${it.p}</div></div><span class="badge">${it.t==='app'?'App':it.t==='dir'?'Folder':'File'}</span>`;
    r.addEventListener('mouseenter',()=>{sel=i; sync()});
    list.appendChild(r);
  });
  if(sel>=items.length) sel=0;
  syncPreview(items[sel]);
}
function sync(){
  const rows=list.querySelectorAll('.row');
  rows.forEach((r,i)=>r.classList.toggle('sel', i===sel));
  const v=q.value.trim(), ql=v.toLowerCase();
  let items=apps.filter(a=> !ql || a.n.toLowerCase().includes(ql) || a.p.toLowerCase().includes(ql));
  if(!v) items=apps.slice(0,9);
  if(items[sel]) syncPreview(items[sel]);
}
function syncPreview(it){
  if(!it) return;
  pi.textContent=it.i; pt.textContent=it.n; pk.textContent=it.k; pw.textContent=it.p;
}
q.addEventListener('input',()=>{sel=0;render()});
q.addEventListener('keydown',e=>{
  const n=list.querySelectorAll('.row').length;
  if(e.key==='ArrowDown'){sel=Math.min(n-1,sel+1);sync();e.preventDefault()}
  if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);sync();e.preventDefault()}
  if(e.key==='Escape'){q.value='';sel=0;render()}
});
render(); q.focus();
</script>
</body>
</html>
